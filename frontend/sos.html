<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pawpal — SOS Reports</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="has-sidebar">
  <!-- Cute Header -->
  <script type="module">
    import { initHeader } from "./js/header.js";
    import { initSidebar } from "./js/sidebar.js";
    initHeader();
    initSidebar();
  </script>

  <!-- Main Content -->
  <main class="container">
    <div class="page-header">
      <h1>SOS Reports</h1>
      <p class="page-subtitle">View all emergency reports and help pets in need</p>
    </div>

    <!-- Category Filters -->
    <div class="category-filters">
      <button class="category-filter active" data-category="ALL">
        <span>All</span>
        <span class="filter-count" id="count-all">0</span>
      </button>
      <button class="category-filter" data-category="ADOPTION">
        <span>🐾 Adoption</span>
        <span class="filter-count" id="count-adoption">0</span>
      </button>
      <button class="category-filter" data-category="LOST">
        <span>🔍 Lost</span>
        <span class="filter-count" id="count-lost">0</span>
      </button>
      <button class="category-filter" data-category="INJURED">
        <span>🏥 Injured</span>
        <span class="filter-count" id="count-injured">0</span>
      </button>
      <button class="category-filter" data-category="SICK">
        <span>💊 Sick</span>
        <span class="filter-count" id="count-sick">0</span>
      </button>
      <button class="category-filter" data-category="OTHER">
        <span>❓ Other</span>
        <span class="filter-count" id="count-other">0</span>
      </button>
    </div>

    <!-- Search Bar -->
    <div class="search-section">
      <input 
        type="text" 
        id="sosSearch" 
        class="search-input" 
        placeholder="Search by name, phone, location, or description..."
        autocomplete="off"
      />
    </div>

    <!-- SOS Reports List -->
    <section>
      <div id="sosList" class="cards-grid">
        <!-- Reports will be loaded here -->
      </div>
    </section>
  </main>

  <!-- Image Modal -->
  <div id="imageModal" class="modal">
    <span class="modal-close" onclick="closeImageModal()">&times;</span>
    <img class="modal-content" id="modalImage" alt="Full size image">
  </div>

  <script type="module">
    import { updateNavigation } from "./js/nav.js";
    updateNavigation();
  </script>
  <script type="module" src="./js/sos.js"></script>
  <script src="./js/modal.js"></script>
</body>
</html>
