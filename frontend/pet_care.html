<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pawpal — Pet Care Guide</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./styles.css" />
  <style>
    .pet-selector {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      margin: 30px 0;
    }

    .pet-option {
      background: linear-gradient(135deg, #fff5f5 0%, #ffeef0 100%);
      border: 2px solid rgba(255, 182, 193, 0.3);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(255, 182, 193, 0.2);
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
    }

    .pet-option::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(255, 182, 193, 0.1) 0%, rgba(255, 192, 203, 0.05) 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .pet-option:hover::before {
      opacity: 1;
    }

    .pet-option:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 8px 25px rgba(255, 182, 193, 0.4);
      border-color: rgba(255, 182, 193, 0.6);
    }

    .pet-option.selected {
      background: linear-gradient(135deg, #ffeef0 0%, #ffb6c1 100%);
      border-color: #d63384;
      box-shadow: 0 8px 25px rgba(214, 51, 132, 0.4);
      transform: translateY(-4px);
    }

    .pet-option.selected::before {
      opacity: 1;
    }

    .pet-option-image {
      width: 100%;
      height: 120px;
      background: linear-gradient(135deg, #ffeef0 0%, #fff5f5 50%, #ffeef0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      position: relative;
      overflow: hidden;
    }

    .pet-option-image::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255, 182, 193, 0.1) 0%, transparent 70%);
      animation: shimmer 3s infinite;
    }

    @keyframes shimmer {
      0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
      50% { transform: translate(-50%, -50%) rotate(180deg); }
    }

    .pet-option-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: relative;
      z-index: 1;
    }

    .pet-option-content {
      padding: 16px;
      position: relative;
      z-index: 1;
      background: white;
      text-align: center;
    }

    .pet-option-name {
      font-size: 1.3rem;
      font-weight: 700;
      color: #d63384;
      margin: 0 0 4px;
    }

    .pet-option-species {
      color: #6c757d;
      font-size: 0.8rem;
      font-style: italic;
      margin: 0;
    }

    .care-hint {
      margin-top: 8px;
      color: #d63384;
      font-size: 0.75rem;
      font-weight: 500;
      opacity: 0.7;
    }

    .care-content-wrapper {
      margin-top: 40px;
      animation: fadeInUp 0.5s ease;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .selected-pet-header {
      background: linear-gradient(135deg, #ffeef0 0%, #fff5f5 100%);
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 30px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(255, 182, 193, 0.2);
    }

    .selected-pet-emoji {
      font-size: 4rem;
      margin-bottom: 15px;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .selected-pet-name {
      font-size: 2.5rem;
      color: #d63384;
      margin: 0 0 8px;
      font-weight: 700;
    }

    .selected-pet-species {
      font-size: 1.1rem;
      color: #6c757d;
      font-style: italic;
      margin: 0;
    }

    .care-section {
      background: white;
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 24px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      border: 2px solid rgba(255, 182, 193, 0.1);
      transition: all 0.3s ease;
    }

    .care-section:hover {
      box-shadow: 0 6px 20px rgba(255, 182, 193, 0.15);
      border-color: rgba(255, 182, 193, 0.3);
    }

    .care-section-title {
      font-size: 1.8rem;
      color: #d63384;
      margin: 0 0 20px;
      padding-bottom: 15px;
      border-bottom: 3px solid #ffeef0;
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
    }

    .care-item {
      background: linear-gradient(135deg, #fff5f5 0%, #ffeef0 100%);
      border-left: 5px solid #d63384;
      padding: 24px;
      margin-bottom: 16px;
      border-radius: 12px;
      transition: all 0.3s ease;
    }

    .care-item:hover {
      transform: translateX(5px);
      box-shadow: 0 4px 12px rgba(214, 51, 132, 0.15);
    }

    .care-item-title {
      font-size: 1.3rem;
      color: #d63384;
      margin: 0 0 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .care-item-content {
      color: #495057;
      line-height: 1.8;
      font-size: 1rem;
    }

    .care-item-content ul {
      margin: 12px 0;
      padding-left: 28px;
    }

    .care-item-content li {
      margin: 10px 0;
      position: relative;
    }

    .care-item-content li::marker {
      color: #d63384;
    }

    .activities-header {
      color: #d63384;
      margin: 20px 0 12px;
      font-weight: 600;
      font-size: 1.1rem;
    }

    .no-pet-selected {
      text-align: center;
      padding: 60px 20px;
      color: #6c757d;
    }

    .no-pet-selected-emoji {
      font-size: 5rem;
      margin-bottom: 20px;
    }
  </style>
</head>
<body class="has-sidebar">
  <!-- Navigation -->
  <script type="module">
    import { initHeader } from "./js/header.js";
    import { initSidebar } from "./js/sidebar.js";
    initHeader();
    initSidebar();
  </script>

  <!-- Main Content -->
  <main class="container">
    <div class="page-header">
      <h1>💚 Pet Care Guide</h1>
      <p class="page-subtitle">Essential care routines for your beloved pets</p>
    </div>

    <!-- Pet Selector -->
    <div class="pet-selector" id="petSelector"></div>

    <!-- Selected Pet Header -->
    <div id="selectedPetHeader" class="selected-pet-header" style="display: none;">
      <div class="selected-pet-emoji" id="selectedPetEmoji"></div>
      <h2 class="selected-pet-name" id="selectedPetName"></h2>
      <p class="selected-pet-species" id="selectedPetSpecies"></p>
    </div>

    <!-- Care Guide Content -->
    <div id="careContent" class="care-content-wrapper" style="display: none;">
      <div class="care-section">
        <h2 class="care-section-title">🛁 Bath Time</h2>
        <div id="bathTimeContent"></div>
      </div>

      <div class="care-section">
        <h2 class="care-section-title">🍽️ Feed Time</h2>
        <div id="feedTimeContent"></div>
      </div>

      <div class="care-section">
        <h2 class="care-section-title">🎮 Play Time</h2>
        <div id="playTimeContent"></div>
      </div>

      <div class="care-section">
        <h2 class="care-section-title">😊 Keep Them Happy</h2>
        <div id="happinessContent"></div>
      </div>
    </div>

    <div id="noSelection" class="no-pet-selected">
      <div class="no-pet-selected-emoji">🐾</div>
      <h2 style="color: #d63384; margin-bottom: 10px;">Select a pet to view care guide</h2>
      <p style="color: #6c757d;">Choose a pet from above to see specific care instructions</p>
    </div>

    <!-- Loading State -->
    <div id="loading" class="loading-spinner">
      <div class="spinner"></div>
      <p>Loading pet information...</p>
    </div>
  </main>

  <script type="module">
    import { getJSON } from "./js/api.js";
    
    let pets = [];
    let selectedPet = null;

    async function loadPets() {
      const loadingEl = document.getElementById('loading');
      const selectorEl = document.getElementById('petSelector');

      try {
        // Try to load from backend static resources
        pets = await getJSON('/data/pets.json');
        loadingEl.style.display = 'none';
        
        renderPetSelector();
      } catch (error) {
        console.error('Error loading pets:', error);
        loadingEl.innerHTML = `
          <div style="text-align: center; padding: 40px;">
            <p style="color: var(--error); margin-bottom: 10px;">Failed to load pet information.</p>
            <p style="color: var(--muted); font-size: 0.9rem;">Error: ${error.message}</p>
            <p style="color: var(--muted); font-size: 0.9rem; margin-top: 10px;">Please make sure the backend server is running on http://localhost:8080</p>
          </div>
        `;
      }
    }

    function renderPetSelector() {
      const selectorEl = document.getElementById('petSelector');
      selectorEl.innerHTML = pets.map(pet => {
        const emoji = pet.emoji || '🐾';
        const imageUrl = pet.image 
          ? (pet.image.startsWith('http://') || pet.image.startsWith('https://') 
              ? pet.image 
              : `http://localhost:8080/${pet.image}`)
          : null;
        
        const imageHtml = imageUrl
          ? `<img src="${imageUrl}" alt="${pet.name}" style="max-width: 80px; max-height: 80px; object-fit: contain;" onerror="this.parentElement.innerHTML='${emoji}'; this.parentElement.style.fontSize='2.5rem';">`
          : emoji;
        
        return `
        <div class="pet-option" data-pet-id="${pet.id}">
          <div class="pet-option-image">
            ${imageHtml}
          </div>
          <div class="pet-option-content">
            <h3 class="pet-option-name">${pet.name}</h3>
            <p class="pet-option-species">${pet.species}</p>
            <p class="care-hint">Click for care guide →</p>
          </div>
        </div>
      `;
      }).join('');

      // Add click handlers
      document.querySelectorAll('.pet-option').forEach(option => {
        option.addEventListener('click', () => {
          const petId = parseInt(option.dataset.petId);
          selectPet(petId);
        });
      });
    }

    function selectPet(petId) {
      selectedPet = pets.find(p => p.id === petId);
      
      // Update UI
      document.querySelectorAll('.pet-option').forEach(opt => {
        opt.classList.remove('selected');
      });
      document.querySelector(`[data-pet-id="${petId}"]`).classList.add('selected');
      
      // Show selected pet header
      document.getElementById('selectedPetEmoji').textContent = selectedPet.emoji || '🐾';
      document.getElementById('selectedPetName').textContent = selectedPet.name;
      document.getElementById('selectedPetSpecies').textContent = selectedPet.species;
      document.getElementById('selectedPetHeader').style.display = 'block';
      
      document.getElementById('noSelection').style.display = 'none';
      document.getElementById('careContent').style.display = 'block';
      
      // Scroll to care content smoothly
      setTimeout(() => {
        document.getElementById('careContent').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 100);
      
      renderCareGuide();
    }

    function renderCareGuide() {
      if (!selectedPet || !selectedPet.careGuide) {
        document.getElementById('careContent').innerHTML = 
          '<p>Care guide information not available for this pet.</p>';
        return;
      }

      const guide = selectedPet.careGuide;

      // Bath Time
      const bathTimeEl = document.getElementById('bathTimeContent');
      if (guide.bathTime) {
        bathTimeEl.innerHTML = `
          <div class="care-item">
            <h3 class="care-item-title">📅 Frequency: ${guide.bathTime.frequency}</h3>
            <div class="care-item-content">
              <ul>
                ${guide.bathTime.tips.map(tip => `<li>${tip}</li>`).join('')}
              </ul>
            </div>
          </div>
        `;
      }

      // Feed Time
      const feedTimeEl = document.getElementById('feedTimeContent');
      if (guide.feedTime) {
        feedTimeEl.innerHTML = `
          <div class="care-item">
            <h3 class="care-item-title">⏰ Schedule: ${guide.feedTime.schedule}</h3>
            <div class="care-item-content">
              <ul>
                ${guide.feedTime.tips.map(tip => `<li>${tip}</li>`).join('')}
              </ul>
            </div>
          </div>
        `;
      }

      // Play Time
      const playTimeEl = document.getElementById('playTimeContent');
      if (guide.playTime) {
        playTimeEl.innerHTML = `
          <div class="care-item">
            <h3 class="care-item-title">⏱️ Duration: ${guide.playTime.duration}</h3>
            <div class="care-item-content">
              <div class="activities-header">🎯 Recommended Activities:</div>
              <ul>
                ${guide.playTime.activities.map(activity => `<li>${activity}</li>`).join('')}
              </ul>
            </div>
          </div>
        `;
      }

      // Happiness Tips
      const happinessEl = document.getElementById('happinessContent');
      if (guide.happinessTips) {
        happinessEl.innerHTML = `
          <div class="care-item">
            <div class="care-item-content">
              <ul>
                ${guide.happinessTips.map(tip => `<li>${tip}</li>`).join('')}
              </ul>
            </div>
          </div>
        `;
      }
    }

    // Load pets on page load
    loadPets();
  </script>
</body>
</html>
