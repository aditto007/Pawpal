# === Server (optional) ===
# server.port=8080

# === MySQL ===
spring.datasource.url=jdbc:mysql://localhost:3306/pawpal?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=pawpal_user
spring.datasource.password=pawpal_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# === JPA/Hibernate ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Let Hibernate auto-detect the dialect (avoids the MySQL8Dialect deprecation warning)
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# === File uploads ===
# Use forward slashes on Windows; this matches WebConfig + SosController
file.upload-dir=E:/Pawpal/backend/uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# === CORS (for local frontends) ===
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:5500,http://127.0.0.1:5500
spring.web.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
